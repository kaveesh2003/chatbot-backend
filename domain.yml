version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - ask_destinations
  - ask_hotels
  - ask_guidelines
  - ask_about_sri_lanka
  - ask_for_travel_tips
  - ask_for_hotels
  - ask_for_visa_information
  - ask_for_popular_destinations

responses:
  utter_greet:
    - text: "Hello! How can I help you with your travel plans?"

  utter_goodbye:
    - text: "Goodbye! Safe travels and see you next time."

  utter_happy:
    - text: "That's great to hear! Let me know if I can help with your travel plans."

  utter_cheer_up:
    - text: "I'm sorry to hear that. Maybe a trip to Sri Lanka can cheer you up?"

  utter_did_that_help:
    - text: "Did that help you feel a little better?"

  utter_ask_about_sri_lanka:
    - text: "Sri Lanka is a beautiful island nation with beaches, mountains, and rich history. What would you like to know?"

  utter_ask_for_travel_tips:
    - text: "Sure! Always carry bottled water, keep local currency, and respect cultural sites."

  utter_ask_for_hotels:
    - text: "I can help with that. Which city or region are you planning to stay in?"

  utter_ask_for_visa_information:
    - text: "Most tourists need to apply for an Electronic Travel Authorization (ETA) before arriving."

  utter_ask_for_popular_destinations:
    - text: "Some popular spots include Sigiriya, Ella, Nuwara Eliya, and Galle. Want details on one of them?"

  utter_default:
    - text: "Sorry, I couldn't process that request. Please try again later."

actions:
  - utter_greet
  - utter_goodbye
  - utter_happy
  - utter_cheer_up
  - utter_did_that_help
  - utter_ask_about_sri_lanka
  - utter_ask_for_travel_tips
  - utter_ask_for_hotels
  - utter_ask_for_visa_information
  - utter_ask_for_popular_destinations
  - action_provide_destinations
  - action_provide_hotels
  - action_provide_guidelines
