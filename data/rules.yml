version: "3.1"

rules:
  - rule: Respond to greetings
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Provide destinations from DB
    steps:
      - intent: ask_destinations
      - action: action_provide_destinations

  - rule: Provide hotels from DB
    steps:
      - intent: ask_hotels
      - action: action_provide_hotels

  - rule: Provide guidelines from DB
    steps:
      - intent: ask_guidelines
      - action: action_provide_guidelines
